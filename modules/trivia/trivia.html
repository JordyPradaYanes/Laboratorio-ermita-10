<div class="encabezado-modulo">
  <h2><i class="fa-solid fa-trophy"></i> Trivia Multijugador</h2>
  <p class="descripcion-modulo">Juega con un amigo en la misma pantalla. Respondan preguntas de ciencias generales por turnos.</p>
</div>

<div class="contenedor-trivia">
  
  <div class="configuracion-trivia" id="configuracionTrivia">
    <div class="tarjeta-configuracion">
      <i class="fa-solid fa-users big-icon"></i>
      <h3>Configurar Partida</h3>
      <div class="grupo-entrada">
        <label>Jugador 1</label>
        <input type="text" id="nombreP1Trivia" class="entrada-texto" value="Jugador 1" />
      </div>
      <div class="grupo-entrada">
        <label>Jugador 2</label>
        <input type="text" id="nombreP2Trivia" class="entrada-texto" value="Jugador 2" />
      </div>
      <button class="btn-primario" id="btnIniciarTrivia" style="margin-top:1rem; width:100%; justify-content:center;">
        <i class="fa-solid fa-play"></i> Comenzar Trivia
      </button>
    </div>
  </div>

  <div class="juego-trivia" id="juegoTrivia" hidden>
    <div class="hud-trivia">
      <div class="jugador-trivia" id="tarjetaP1Trivia">
        <i class="fa-solid fa-user"></i>
        <div class="nombre-jugador-trivia" id="etiquetaP1Trivia">Jugador 1</div>
        <div class="puntaje-jugador-trivia mono" id="puntajeP1Trivia">0</div>
      </div>
      <div class="turno-trivia" id="etiquetaTurnoTrivia">Turno de: Jugador 1</div>
      <div class="jugador-trivia" id="tarjetaP2Trivia">
        <i class="fa-regular fa-user"></i>
        <div class="nombre-jugador-trivia" id="etiquetaP2Trivia">Jugador 2</div>
        <div class="puntaje-jugador-trivia mono" id="puntajeP2Trivia">0</div>
      </div>
    </div>

    <div class="tarjeta-pregunta-trivia">
      <div class="contador-pregunta-trivia" id="contadorPreguntaTrivia">Pregunta 1 de 10</div>
      <h3 class="texto-pregunta-trivia" id="textoPreguntaTrivia">¿Pregunta?</h3>
      <div class="opciones-trivia" id="opcionesTrivia">
        <!-- Generado por JS -->
      </div>
      <button class="btn-primario" id="btnSiguienteTrivia" hidden>Siguiente Turno <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>

  <div class="victoria-trivia" id="victoriaTrivia" hidden>
    <div class="tarjeta-victoria">
      <i class="fa-solid fa-crown big-icon" style="color:var(--clr-warning);"></i>
      <h3 id="tituloVictoriaTrivia">¡Ganador!</h3>
      <p id="descVictoriaTrivia">Jugador 1 gana con 5 puntos.</p>
      <button class="btn-primario" id="btnReiniciarTrivia"><i class="fa-solid fa-rotate-right"></i> Nueva Partida</button>
    </div>
  </div>

</div>
