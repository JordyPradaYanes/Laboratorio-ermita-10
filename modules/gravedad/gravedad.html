<div class="module-header">
  <h2><i class="fa-solid fa-earth-americas"></i> Laboratorio de Gravedad</h2>
  <p class="module-desc">Observa cómo cae un objeto en diferentes entornos de gravedad. ¡Tú eliges el planeta!</p>
</div>

<div class="gravity-container">

  <!-- ── Visualización: el canal de caída ── -->
  <div class="gravity-panel">
    <div id="canalCaida">
      <div id="objeto" title="¡Soy el objeto que cae!"></div>
      <div id="suelo"></div>
    </div>
  </div>

  <!-- ── Controles del laboratorio ── -->
  <div class="gravity-controls">

    <!-- Botones de planeta -->
    <div class="input-group">
      <label>Elige un planeta:</label>
      <div class="env-btns">
        <button class="btn-secondary active-mode" id="btnTierra">
          <i class="fa-solid fa-earth-americas"></i> Tierra (9.8 m/s²)
        </button>
        <button class="btn-secondary" id="btnLuna">
          <i class="fa-solid fa-moon"></i> Luna (1.6 m/s²)
        </button>
        <button class="btn-secondary" id="btnJupiter">
          <i class="fa-solid fa-meteor"></i> Júpiter (24.8 m/s²)
        </button>
      </div>
    </div>

    <!-- Botones de acción -->
    <div style="display:flex; gap:0.6rem; margin-top:1.5rem;">
      <button class="btn-primary" id="gravDropBtn" style="flex:1; justify-content:center; padding:0.9rem; font-size:1.05rem;">
        <i class="fa-solid fa-arrow-down"></i> Soltar objeto
      </button>
      <button class="btn-secondary" id="gravResetBtn" style="justify-content:center; padding:0.9rem 1.2rem;" title="Reiniciar">
        <i class="fa-solid fa-rotate-right"></i> Reiniciar
      </button>
    </div>

    <!-- Resultados -->
    <div class="gravity-stats" id="gravStats" hidden style="margin-top:2rem; padding-top:2rem; border-top:1px solid var(--clr-border);">
      <h3 style="font-size:1.1rem; margin-bottom:0.8rem; color:var(--clr-accent);">Resultados</h3>
      <p>Planeta elegido: <strong id="gravPlaneta" class="mono" style="font-size:1.1rem;">—</strong></p>
      <p>Tiempo de caída: <strong id="gravTime" class="mono" style="font-size:1.1rem;">0.00</strong> s</p>
    </div>

  </div>
</div>
