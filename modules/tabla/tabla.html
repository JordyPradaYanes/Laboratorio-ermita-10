<div class="encabezado-modulo">
  <h2><i class="fa-solid fa-table-cells"></i> Tabla Periódica Interactiva</h2>
  <p class="descripcion-modulo">Filtra por familia de elementos y haz clic para ver detalles de cada uno.</p>
</div>

<div class="contenedor-tabla">
  <div class="filtros-tabla" id="filtrosTabla">
    <button class="btn-filtro activo" data-family="todos">Todos (118)</button>
    <button class="btn-filtro" data-family="metal-alcalino">Metales alcalinos</button>
    <button class="btn-filtro" data-family="metal-alcalinoterreo">Alcalinotérreos</button>
    <button class="btn-filtro" data-family="metal-transicion">Metales de transición</button>
    <button class="btn-filtro" data-family="lantanido">Lantánidos</button>
    <button class="btn-filtro" data-family="actinido">Actínidos</button>
    <button class="btn-filtro" data-family="metal-otro">Otros metales</button>
    <button class="btn-filtro" data-family="semimetal">Metaloides</button>
    <button class="btn-filtro" data-family="no-metal">No metales</button>
    <button class="btn-filtro" data-family="halogenos">Halógenos</button>
    <button class="btn-filtro" data-family="gas-noble">Gases nobles</button>
  </div>

  <div class="envoltura-tabla">
    <div class="tabla-periodica" id="tablaPeriodica">
      <!-- Generado por JS -->
    </div>
  </div>
</div>

<!-- Modal -->
<div class="superposicion-modal" id="modalElemento" role="dialog" aria-modal="true" aria-labelledby="tituloElementoModal" hidden>
  <div class="tarjeta-modal">
    <button class="cerrar-modal" id="cerrarModalElemento" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    <div class="encabezado-elemento-modal">
      <div class="simbolo-elemento-modal" id="simboloModal"></div>
      <div>
        <h3 id="tituloElementoModal"></h3>
        <p id="subElementoModal" style="color:var(--clr-text-muted); font-size:0.85rem;"></p>
      </div>
    </div>
    <div class="cuerpo-elemento-modal" id="cuerpoElementoModal"></div>
  </div>
</div>
