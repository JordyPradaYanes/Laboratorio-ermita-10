<div class="encabezado-modulo">
  <h2><i class="fa-solid fa-clone"></i> Juego de Memoria en Inglés</h2>
  <p class="descripcion-modulo">Encuentra los pares de palabras en inglés y su traducción al español.</p>
</div>

<div class="contenedor-memoria">
  <div class="hud-memoria">
    <div class="tarjeta-hud"><span class="etiqueta-hud">Intentos</span><span class="valor-hud mono" id="intentosMemoria">0</span></div>
    <div class="tarjeta-hud"><span class="etiqueta-hud">Pares</span><span class="valor-hud mono" id="parejasMemoria">0 / 8</span></div>
    <div class="tarjeta-hud"><span class="etiqueta-hud">Tiempo</span><span class="valor-hud mono" id="tiempoMemoria">0s</span></div>
  </div>

  <div class="tablero-memoria" id="tableroMemoria" role="grid" aria-label="Tablero de memoria"></div>

  <div class="controles-memoria">
    <button class="btn-primario" id="btnReiniciarMemoria"><i class="fa-solid fa-shuffle"></i> Nueva partida</button>
  </div>

  <div class="victoria-memoria" id="victoriaMemoria" hidden>
    <div class="tarjeta-victoria">
      <i class="fa-solid fa-trophy icono-grande"></i>
      <h3>¡Excelente!</h3>
      <p>Completaste el juego en <strong id="tiempoVictoriaMemoria"></strong> con <strong id="intentosVictoriaMemoria"></strong> intentos.</p>
      <button class="btn-primario" id="btnReiniciarVictoriaMemoria"><i class="fa-solid fa-rotate-right"></i> Jugar de nuevo</button>
    </div>
  </div>
</div>
