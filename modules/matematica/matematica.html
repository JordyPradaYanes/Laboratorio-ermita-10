<div class="encabezado-modulo">
  <h2><i class="fa-solid fa-calculator"></i> Misión Matemática</h2>
  <p class="descripcion-modulo">Resuelve operaciones aleatorias antes de que el tiempo termine. ¡Pon a prueba tu velocidad mental!</p>
</div>

<div class="contenedor-matematica">
  <div class="panel-hud-matematica">
    <div class="tarjeta-hud"><span class="etiqueta-hud">Puntos</span><span class="valor-hud mono" id="puntajeMatematica">0</span></div>
    <div class="tarjeta-hud tarjeta-tiempo"><span class="etiqueta-hud">Tiempo</span><span class="valor-hud mono" id="tiempoMatematica">30</span></div>
    <div class="tarjeta-hud"><span class="etiqueta-hud">Racha</span><span class="valor-hud mono" id="rachaMatematica"><i class="fa-solid fa-fire"></i> 0</span></div>
  </div>

  <div class="area-juego-matematica" id="areaJuegoMatematica">
    
    <div class="pantalla-inicio-matematica" id="pantallaInicioMatematica">
      <i class="fa-solid fa-calculator icono-grande"></i>
      <h3>¿Listo para el reto?</h3>
      <p>Responde la mayor cantidad de operaciones correctas en 30 segundos.</p>
      <div class="botones-dificultad">
        <button class="btn-primario" id="btnMatematicaFacil"><i class="fa-regular fa-face-smile"></i> Fácil</button>
        <button class="btn-primario" id="btnMatematicaMedio"><i class="fa-solid fa-bolt"></i> Medio</button>
        <button class="btn-primario" id="btnMatematicaDificil"><i class="fa-solid fa-fire"></i> Difícil</button>
      </div>
    </div>

    <div class="pantalla-juego-matematica" id="pantallaJuegoMatematica" hidden>
      <div class="pregunta-matematica" id="preguntaMatematica">?</div>
      <input type="number" class="entrada-matematica" id="entradaMatematica" placeholder="Tu respuesta..." autocomplete="off" />
      <button class="btn-primario" id="botonConfirmarMatematica"><i class="fa-solid fa-check"></i> Confirmar</button>
      <div class="retroalimentacion-matematica" id="retroalimentacionMatematica"></div>
    </div>

    <div class="pantalla-resultado-matematica" id="pantallaResultadoMatematica" hidden>
      <i class="fa-solid fa-trophy icono-grande" id="iconoResultadoMatematica"></i>
      <h3>¡Tiempo!</h3>
      <p>Tu puntuación: <strong class="mono" id="puntajeFinalMatematica" style="font-size:1.5rem; color:var(--clr-primary);">0</strong></p>
      <p>Respuestas correctas: <strong id="correctasMatematica">0</strong></p>
      <button class="btn-primario" id="btnReiniciarMatematica"><i class="fa-solid fa-rotate-right"></i> Jugar de nuevo</button>
    </div>

  </div>
</div>
