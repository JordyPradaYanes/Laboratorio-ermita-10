<div class="encabezado-modulo">
  <h2><i class="fa-solid fa-drafting-compass"></i> Teorema de Pitágoras</h2>
  <p class="descripcion-modulo">Ajusta los catetos de un triángulo rectángulo para ver cómo cambia la hipotenusa (a² + b² = c²).</p>
</div>

<div class="contenedor-pitagoras">
  <div class="visual-pitagoras">
    <canvas id="lienzoPitagoras" width="480" height="460" style="max-width:100%; height:auto;"></canvas>
  </div>

  <div class="panel-pitagoras">
    <div class="controles-pitagoras">
      <div class="grupo-entrada">
        <label for="pitA">Cateto a (altura): <span id="valPitA" class="mono">3</span></label>
        <input type="range" id="pitA" min="1" max="15" step="1" value="3" class="slider" />
      </div>
      <div class="grupo-entrada">
        <label for="pitB">Cateto b (base): <span id="valPitB" class="mono">4</span></label>
        <input type="range" id="pitB" min="1" max="15" step="1" value="4" class="slider" />
      </div>
    </div>

    <div class="formula-pitagoras">
      <div class="linea-formula">a² + b² = c²</div>
      <div class="linea-formula"><span id="formA2">3²</span> + <span id="formB2">4²</span> = c²</div>
      <div class="linea-formula"><span id="formA2val">9</span> + <span id="formB2val">16</span> = c²</div>
      <div class="linea-formula"><span id="formSuma">25</span> = c²</div>
      <div class="resultado-formula">
        c = <span id="formC" style="color:var(--clr-primary);">5</span>
      </div>
    </div>
  </div>
</div>
